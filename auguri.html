<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Per la mia Polpettina ❤️</title>

<style>
body {
  margin:0;
  font-family:-apple-system, sans-serif;
  background: radial-gradient(circle at top, #0d1b2a, #000814);
  color:white;
  overflow:hidden;
}

#intro {
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
}

#intro h1 {
  color:#ffd700;
  text-shadow:0 0 20px gold;
}

#app {
  display:none;
  height:100vh;
  overflow:auto;
}

.header {
  text-align:center;
  padding:30px;
}

.header h1 {
  color:#ffd700;
}

.card {
  background:linear-gradient(#fff5f5,#ffe3e3);
  color:#3a0000;
  margin:20px;
  padding:25px;
  border-radius:20px;
  box-shadow:0 0 40px rgba(255,215,0,0.5);
}

.rose {
  text-align:center;
  font-size:70px;
}

#letter {
  font-size:1.3em;
  line-height:1.7em;
  white-space:pre-line;
}

.signature {
  margin-top:20px;
  font-size:1.5em;
  text-align:right;
  opacity:0;
  transform:translateY(10px);
  transition:1.5s;
  font-style:italic;
}

.signature.show {
  opacity:1;
  transform:translateY(0);
}

/* PETALI */
.petal {
  position:fixed;
  top:-10px;
  font-size:20px;
  pointer-events:none;
  animation:fall linear infinite;
}

@keyframes fall {
  0% { transform:translateY(0) translateX(0) rotate(0deg); }
  50% { transform:translateY(50vh) translateX(20px) rotate(180deg); }
  100% { transform:translateY(100vh) translateX(-20px) rotate(360deg); }
}
</style>
</head>

<body>

<div id="intro" onclick="enterApp()">
  <h1>🌹 C'era una volta... 🌹</h1>
  <p>Tocca per entrare nella tua favola ✨</p>
</div>

<div id="app">

<div class="header">
  <h1>✨ Buon Compleanno Polpettina ✨</h1>
</div>

<div class="card rose">🌹</div>

<div class="card">
  <div id="letter"></div>
  <div id="signature" class="signature">Angelo.</div>
</div>

</div>

<audio id="music" playsinline>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_9c6a9c1a1e.mp3">
</audio>

<script>
// ===== ENTRATA =====
function enterApp(){
  const music=document.getElementById("music");

  music.play().then(()=>{
    music.pause();
    music.currentTime=0;
  });

  document.getElementById("intro").style.display="none";
  document.getElementById("app").style.display="block";

  createPetals();
  startLetter();
}

// ===== TESTO =====
const text = `Alla mia piccola Manuela,

Questo piccolo messaggio è solo un modo per dirti quanto sei speciale per me
e quanto sono fiero di te,
della donna che stai diventando e della grande forza d’animo che metti in ogni cosa che fai.

Meriti ancora tantissimo dalla vita,
e sono certo che riuscirai a realizzare tutti i tuoi sogni.

Io sarò sempre qui, accanto a te,
a supportarti in ogni tua scelta, anche la più difficile.

Ancora tantissimi auguri di buon compleanno, amore mio ❤️`;

let i=0;

// ===== LETTERA =====
function startLetter(){
  const el=document.getElementById("letter");

  function type(){
    if(i < text.length){
      el.innerHTML += text.charAt(i);
      i++;
      setTimeout(type, 55);
    } else {
      startFinale();
    }
  }

  type();
}

// ===== FINALE =====
function startFinale(){
  const music=document.getElementById("music");
  music.play();

  createMorePetals();

  // ✨ firma appare alla fine
  document.getElementById("signature").classList.add("show");

  if(navigator.vibrate){
    navigator.vibrate([200,100,200]);
  }
}

// ===== PETALI =====
function createPetals(){
  for(let i=0;i<20;i++) spawnPetal();
}

function createMorePetals(){
  for(let i=0;i<40;i++) spawnPetal();
}

function spawnPetal(){
  let p=document.createElement("div");
  p.className="petal";
  p.innerHTML="🌹";
  p.style.left=Math.random()*100+"%";
  p.style.animationDuration=(6+Math.random()*6)+"s";
  document.body.appendChild(p);
}
</script>

</body>
</html>
